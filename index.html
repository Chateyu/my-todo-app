<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- 깜빡임 방지: CSS 적용 전에 테마 먼저 결정 -->
  <script>
    (function () {
      var saved = localStorage.getItem("todo-theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>To-Do List</h1>
        <p class="summary" id="summary">0 tasks</p>
      </div>
      <button type="button" class="theme-btn" id="theme-btn" aria-label="Toggle dark mode">Dark</button>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <div class="add-row">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="Add a new task..."
          maxlength="120"
          aria-label="New task"
        />
        <button type="submit" class="add-btn">Add</button>
      </div>
      <div class="option-row">
        <input type="date" id="due-input" class="option" aria-label="Due date" />
        <select id="priority-input" class="option" aria-label="Priority">
          <option value="0">No priority</option>
          <option value="1">! Low</option>
          <option value="2">!! Medium</option>
          <option value="3">!!! High</option>
        </select>
        <select id="category-input" class="option" aria-label="Category">
          <option value="">No category</option>
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
          <option value="Shopping">Shopping</option>
        </select>
      </div>
    </form>

    <div class="toolbar">
      <div class="filters" role="tablist">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <select id="category-filter" class="option" aria-label="Filter by category">
        <option value="">All categories</option>
        <option value="Personal">Personal</option>
        <option value="Work">Work</option>
        <option value="Study">Study</option>
        <option value="Shopping">Shopping</option>
      </select>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <p class="empty" id="empty-state">Nothing to do. Enjoy your day.</p>

    <footer class="app-footer">
      <span class="hint">Double-click to edit · Drag ⋮⋮ to reorder</span>
      <button type="button" class="clear-btn" id="clear-btn">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
